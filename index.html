<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>50代・60代のお金タイプ診断</title>
<style>[hidden]{display:none!important}img{max-width:100%}</style>

<style>
/* Layout: one calm column on pale mint — green header band, white cards, a piggy-bank illustration in the hero */
:root{
  --paper:#f2f7f3; --board:#ffffff; --ink:#1d3328; --navy:#1d6a4d; --sub:#5a7066;
  --accent:#23845c; --accent-ink:#ffffff; --stamp:#1d6a4d; --hi:#f2b632; --hi-ink:#1d3328;
  --line:#d8e8de; --mark:#cfeedd; --soft:#e9f4ed; --good:#23845c;
  --band:#1d6a4d; --band-ink:#ffffff; --coin:#f2b632; --coin-dk:#c98a12; --pig:#f5bcc6; --pig-dk:#d98797;
  --shadow:0 2px 10px rgba(29,106,77,.08);
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1a15; --board:#16241d; --ink:#e8f2ec; --navy:#7fd1a8; --sub:#9db5a9;
  --accent:#4fbf8a; --accent-ink:#0b1a12; --stamp:#7fd1a8; --hi:#f2c14e; --hi-ink:#1d3328;
  --line:#25392f; --mark:rgba(79,191,138,.3); --soft:#1c2e25; --good:#6fd39f;
  --band:#143d2d; --band-ink:#e8f2ec; --coin:#f2c14e; --coin-dk:#b8860b; --pig:#e9a9b5; --pig-dk:#c47a89;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1a15; --board:#16241d; --ink:#e8f2ec; --navy:#7fd1a8; --sub:#9db5a9;
  --accent:#4fbf8a; --accent-ink:#0b1a12; --stamp:#7fd1a8; --hi:#f2c14e; --hi-ink:#1d3328;
  --line:#25392f; --mark:rgba(79,191,138,.3); --soft:#1c2e25; --good:#6fd39f;
  --band:#143d2d; --band-ink:#e8f2ec; --coin:#f2c14e; --coin-dk:#b8860b; --pig:#e9a9b5; --pig-dk:#c47a89;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.75;margin:0}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.band b{font-family:var(--f-disp);font-size:16px;letter-spacing:.04em}
.band span{font-size:13px;opacity:.85}

h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.35}
.board{background:var(--board);border:1px solid var(--line);border-radius:18px;padding:26px 22px 24px;position:relative;margin-top:24px;box-shadow:var(--shadow)}
.kicker{font-size:14px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(24px,7vw,42px);color:var(--navy);margin-top:6px}
.hero h1 em{white-space:nowrap}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 70%,var(--mark) 70%);color:var(--navy)}
.hero p{margin:14px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.facts span{background:var(--soft);border-radius:999px;padding:4px 14px;font-size:15px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:62px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 21px/1.3 var(--f-body);cursor:pointer;text-decoration:none;padding:12px 18px;text-align:center}
.btn:focus-visible,.opt:focus-visible,.back:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.mt{margin-top:22px}
.sample{margin-top:22px;border-top:2px dashed var(--line);padding-top:18px}
.sample .lbl{font-size:14px;color:var(--sub)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini div{background:var(--soft);border-radius:10px;padding:10px 12px}

.mini strong{font-size:22px;font-variant-numeric:tabular-nums;color:var(--navy)}
.safe{font-size:14px;color:var(--sub);margin-top:14px}

/* question */
.prog{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--sub);font-weight:700}
.bar{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qtext{font-size:clamp(24px,6.4vw,30px);color:var(--ink);margin-top:16px}
.qnote{font-size:15px;color:var(--sub);margin-top:8px}
.opts{display:grid;gap:12px;margin-top:20px}
.opt{display:block;width:100%;text-align:left;min-height:64px;padding:14px 18px;border-radius:14px;border:2px solid var(--line);background:var(--board);color:var(--ink);font:700 20px/1.45 var(--f-body);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--soft)}
.custom{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;font-size:16px;color:var(--sub)}
.custom input{width:7em;font:700 20px var(--f-body);padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--board);color:var(--ink)}
.custom button{font:700 16px var(--f-body);padding:12px 16px;border-radius:10px;border:2px solid var(--navy);background:transparent;color:var(--navy);cursor:pointer}
.back{margin-top:22px;background:none;border:0;color:var(--sub);font:700 16px var(--f-body);cursor:pointer;padding:8px 0}

/* result */
.rhead{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.rhead h2{font-size:clamp(28px,7.6vw,38px);color:var(--navy)}
.rhead p{margin:8px 0 0;font-size:17px}
.stamp{width:96px;height:96px;border:4px solid var(--stamp);border-radius:50%;color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:900;transform:rotate(-12deg);line-height:1.15;text-align:center}
.stamp small{font-size:12px;border-top:2px solid var(--stamp);border-bottom:2px solid var(--stamp);padding:1px 6px;margin:3px 0}
.stamp b{font-size:24px}
.who{font-size:14px;color:var(--sub);margin-top:14px;background:var(--soft);border-radius:8px;padding:6px 12px}
.total{margin-top:22px;background:var(--navy);color:var(--paper);border-radius:12px;padding:18px 20px}
.total small{display:block;font-size:15px;opacity:.9}
.total strong{display:block;font-family:var(--f-disp);font-size:clamp(38px,11vw,54px);line-height:1.2;font-variant-numeric:tabular-nums}
.total strong span{font-size:.45em}
.total p{margin:6px 0 0;font-size:14px;opacity:.9;line-height:1.6}
.cards{display:grid;gap:14px;margin-top:18px}
.card{border:1px solid var(--line);background:var(--board);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{font-size:19px;color:var(--ink);display:flex;gap:10px;align-items:baseline}
.card h3 .tag{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:0 6px;white-space:nowrap}
.num{font-size:clamp(30px,8.6vw,40px);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.3;margin-top:6px}
.num span{font-size:.5em;color:var(--ink)}
.card p{margin:6px 0 0;font-size:16px}
.card .doc{margin-top:10px;font-size:15px;background:var(--soft);border-radius:8px;padding:8px 12px}
.card .doc b{color:var(--accent)}
.card.info .num{font-size:24px}
h3.sec{font-size:22px;color:var(--navy);margin-top:28px}
ol.todo{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:t}
ol.todo li{counter-increment:t;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;font-size:17px}
ol.todo li::before{content:counter(t);width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 19px/36px var(--f-body);text-align:center}
.cta{margin-top:30px;border:2px solid var(--accent);border-radius:18px;padding:20px 18px;background:var(--soft);position:relative}
.cta-k{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.cta h3{font-size:22px;color:var(--ink);margin-top:4px}
.gift{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.gift li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--board);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
.gift .no{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 8px;white-space:nowrap;margin-top:3px}
.gift b{display:block;font-size:17px;line-height:1.5}
.gift small{display:block;font-size:15px;color:var(--sub);line-height:1.6;margin-top:2px}
.cta .plus{font-size:15px;margin:12px 0 0}
.cta ul{margin:10px 0 0;padding-left:1.2em;font-size:16px}
.cta .trust{font-size:14px;color:var(--sub);margin-top:10px}
.ctl{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.ctl button{flex:1;min-height:52px;border-radius:10px;border:2px solid var(--navy);background:transparent;color:var(--navy);font:700 17px var(--f-body);cursor:pointer}
.fine{font-size:13px;color:var(--sub);margin-top:26px;line-height:1.7}
.fine p{margin:0 0 6px}
.hero-top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pigart{width:clamp(104px,28vw,150px);height:auto;display:block}
.pig-b{fill:var(--pig)} .pig-d{fill:var(--pig-dk)} .pig-e{fill:var(--ink)} .pig-l{fill:none;stroke:var(--pig-dk);stroke-width:4;stroke-linecap:round}
.coin-f{fill:var(--coin)} .coin-s{fill:var(--coin-dk)} .coin-t{fill:var(--board);font:700 20px var(--f-body)}
.leaf{fill:var(--accent);opacity:.9}
.drop{animation:drop 2.4s ease-in-out infinite;transform-box:fill-box}
@keyframes drop{0%,20%{transform:translateY(0)}55%{transform:translateY(16px)}56%,100%{transform:translateY(0)}}
.coins{display:inline-flex;gap:0;vertical-align:middle;margin-right:6px}
.coins svg{width:28px;height:28px}
.cta-pig{position:absolute;right:12px;top:-30px;width:64px;height:auto}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.drop{animation:none}}
@media (max-width:400px){.board{padding:26px 16px 20px}.stamp{width:80px;height:80px}.stamp b{font-size:20px}}
</style>
</head>
<body>


<div class="band"><div class="wrap"><b>50歳からのお金の回覧板</b><span>2026年10月の制度で計算</span></div></div>

<main class="wrap" id="app">
  <section class="board hero" id="intro">
    <div class="hero-top"><div>
    <div class="kicker">かんたんな質問・約1分</div>
    <h1>50代・60代の<br><em>お金タイプ診断</em></h1>
    </div>
    <svg class="pigart" viewBox="0 0 170 150" role="img" aria-label="コインを入れる貯金箱のイラスト">
      <g class="drop"><circle class="coin-s" cx="86" cy="22" r="17"/><circle class="coin-f" cx="84" cy="20" r="17"/><text class="coin-t" x="84" y="27" text-anchor="middle">¥</text></g>
      <path class="leaf" d="M140 34c-16 0-24 10-24 22 14 0 24-8 24-22z"/>
      <path class="pig-d" d="M48 66l-8-24 26 14z"/>
      <rect class="pig-d" x="52" y="118" width="16" height="22" rx="6"/><rect class="pig-d" x="100" y="118" width="16" height="22" rx="6"/>
      <ellipse class="pig-b" cx="84" cy="96" rx="58" ry="40"/>
      <rect class="pig-d" x="70" y="58" width="30" height="7" rx="3.5"/>
      <ellipse class="pig-d" cx="141" cy="98" rx="14" ry="12"/>
      <circle class="pig-e" cx="137" cy="96" r="2.6"/><circle class="pig-e" cx="145" cy="96" r="2.6"/>
      <circle class="pig-e" cx="118" cy="84" r="4"/>
      <path class="pig-l" d="M27 92c-10-2-12 8-4 10s4 10-6 8"/>
    </svg>
    </div>
    <p>年金を受け取る前に決めること、今年の年末に戻るお金。まだ60歳前の方も、今の年齢と働き方から<b>「あなたの場合はいくら」</b>を出します。</p>
    <div class="facts"><span>繰下げ</span><span>加給年金</span><span>働いて増える年金</span><span>iDeCo</span><span>年末調整</span></div>
    <button class="btn mt" id="start" type="button">診断をはじめる</button>
    <div class="sample">
      <div class="lbl">結果の例（63歳・会社員・月給35万円・iDeCo月2.3万円の方）</div>
      <div class="mini" id="mini"></div>
    </div>
    <div class="safe">入力した内容はこの画面の中だけで計算します。お名前・口座番号などは聞きません。</div>
  </section>
</main>

<script>
/* ▼ 登録フォームのURLをここに入れる */
const FORM_URL = 'https://1lejend.com/stepmail/kd.php?no=fylTIRnMmke';

const Q = [
  {id:'age', q:'今の年齢は？', opts:[['50歳未満',45],['50〜54歳',50],['55〜59歳',55],['60〜61歳',60],['62〜63歳',62],['64歳',64],['65〜69歳',65],['70歳以上',70]]},
  {id:'recv', q:'老齢基礎年金（国民年金）を、もう受け取っていますか？',
   note:'65歳前の「特別支給の老齢厚生年金」だけを受け取っている方は「まだ」を選んでください。', skip:a=>a.age<60,
   opts:[['まだ受け取っていない',false],['受け取っている（繰上げを含む）',true]]},
  {id:'work', q:'今の働き方は？', opts:[['会社員・パート（厚生年金に入っている）','emp'],['パート・アルバイト（厚生年金に入っていない）','part'],['自営業・フリーランス','self'],['今は働いていない','none']]},
  {id:'pay', q:a=>a.work==='self'?'月の所得（売上から経費を引いた額）は？':'月の給料（額面・税金が引かれる前）は？',
   note:'ボーナスは含めずに選んでください。', skip:a=>a.work==='none',
   opts:[['15万円未満',12],['15〜25万円',20],['25〜35万円',30],['35万円以上',40]], custom:true},
  {id:'ideco', q:'iDeCo（イデコ）の掛金は？', skip:a=>a.age>=70,
   opts:[['入っていない',0],['月1万円くらい',10000],['月2万円くらい',20000],['月2万3千円（今の上限）',23000]]},
  {id:'spouse', q:'配偶者（夫・妻）は？', opts:[['いない',0],['いる（収入なし、またはパートで年136万円以下）',1],['いる（それより収入が多い）',2]]},
  {id:'gap', q:'配偶者は、あなたより何歳年下ですか？', note:'65歳からの年金に上乗せされる「加給年金」の目安を出すために使います。', skip:a=>!a.spouse,
   opts:[['年上・同い年',0],['1〜2歳下',1],['3〜4歳下',3],['5〜6歳下',5],['7歳以上下',7]]},
  {id:'sp20', q:'配偶者は、会社員・公務員として、厚生年金に20年以上入っていましたか？', note:'配偶者のねんきん定期便の「これまでの年金加入期間」で、厚生年金が240か月以上なら20年以上です。', skip:a=>!a.spouse||!a.gap,
   opts:[['20年未満（ずっと扶養・パートなど）','no'],['20年以上','yes'],['わからない','unknown']]},
  {id:'kiso', q:'ねんきん定期便の「老齢基礎年金」の見込額（年額）は？',
   note:a=>a.age<50?'50歳未満の方の定期便は「これまでの加入実績」の金額なので、実際はもっと増えます。迷ったら「わからない」を選んでください。':'50歳以上の方のねんきん定期便の「老齢年金の種類と見込額」の表にあります。',
   skip:a=>a.recv, opts:[['約80万円（ほぼ満額）',800000],['約70万円',700000],['約60万円',600000],['わからない（80万円で計算）',800000]]}
];

/* ---------- 計算（すべて目安） ---------- */
const kyuyoKojo=(R,yr)=>{let f;
  if(R<=1800000)f=R*0.4-100000;else if(R<=3600000)f=R*0.3+80000;else if(R<=6600000)f=R*0.2+440000;else if(R<=8500000)f=R*0.1+1100000;else f=1950000;
  return Math.min(R,Math.max(yr===7?650000:740000,f));};
const kiso=(g,yr)=>{ if(yr===8&&g<=4890000)return 1040000;
  if(g<=1320000)return 950000; if(g<=3360000)return 880000; if(g<=4890000)return 680000; if(g<=6550000)return 630000; if(g<=23500000)return 580000; return 480000;};
const itax=t=>{t=Math.floor(Math.max(0,t)/1000)*1000;let x;
  if(t<=1950000)x=t*.05;else if(t<=3300000)x=t*.1-97500;else if(t<=6950000)x=t*.2-427500;else if(t<=9000000)x=t*.23-636000;else x=t*.33-1536000;
  return Math.floor(x*1.021);};
function taxes(a,ideco,yr){
  if(a.work==='none'||!a.pay) return {it:0,rt:0,g:0};
  const m=a.pay*10000, R=m*12;
  let g, sha;
  if(a.work==='self'){g=R; sha=R*0.10;} else {g=R-kyuyoKojo(R,yr); sha=R*(a.work==='emp'?0.15:0.10);}
  const sp=(a.spouse===1&&g<=9000000)?1:0;
  const it=itax(g-sha-kiso(g,yr)-sp*380000-ideco*12);
  const rt=Math.floor(Math.max(0,g-sha-430000-sp*330000-ideco*12)*0.10);
  return {it,rt,g};
}
const saving=(a,ideco)=>{const b=taxes(a,0,8),c=taxes(a,ideco,8);return (b.it+b.rt)-(c.it+c.rt);};
const r100=n=>Math.round(n/100)*100;
const yen=n=>r100(n).toLocaleString('ja-JP');

function compute(a){
  const out={items:[],todo:[],sum:0};
  const emp=a.work==='emp', salaried=a.work==='emp'||a.work==='part';
  // type
  let t; const young=a.age<60;
  if(young&&emp) t={k:'E',name:'今から仕込む型',s:'仕込む',lead:'まだ60歳前で、厚生年金に入って働くタイプです。今の働き方とiDeCoの使い方が、60代からの年金と手取りをそのまま決めます。'};
  else if(young) t={k:'F',name:'土台づくり型',s:'土台',lead:'会社の厚生年金に入っていないタイプです。国民年金に上乗せできる仕組み（iDeCo・付加年金）を、60歳前のうちに使えるかで差がつきます。'};
  else if(!a.recv&&emp) t={k:'A',name:'増やしながら待つ型',s:'待つ',lead:'働きながら年金を育てられる、いちばん選択肢が多いタイプです。「いつから受け取るか」と「iDeCo」で差がつきます。'};
  else if(a.recv&&emp) t={k:'B',name:'働いて上乗せ型',s:'上乗せ',lead:'年金を受け取りながら働くタイプです。働いた分が毎年の年金に上乗せされ、年末調整でも戻るお金があります。'};
  else if(!a.recv) t={k:'C',name:'受け取り方で差がつく型',s:'受取方',lead:'会社の厚生年金に入っていないタイプです。年金をいつから、どう受け取るかの選び方で、一生の受取額が変わります。'};
  else t={k:'D',name:'取りこぼさない型',s:'取戻',lead:'年金を受け取りながら暮らすタイプです。申告や届け出をすれば戻る・もらえるお金を、確実に受け取ることが大切です。'};
  out.type=t;

  // 1. 在職定時改定 / 厚生年金で増える
  if(emp&&a.age<70&&a.pay){

function showQ(){
  const qs=visible(); const q=qs[idx]; if(!q){showResult();return;}
  const qt=typeof q.q==='function'?q.q(ans):q.q;
  const pct=Math.round(idx/qs.length*100);
  app.innerHTML=`<section class="board" aria-live="polite">
    <div class="prog"><span>質問 ${idx+1}／${qs.length}</span><div class="bar"><i style="width:${pct}%"></i></div></div>
    <h2 class="qtext">${qt}</h2>${q.note?`<div class="qnote">${typeof q.note==='function'?q.note(ans):q.note}</div>`:''}
    <div class="opts">${q.opts.map((o,i)=>`<button type="button" class="opt${ans[q.id]===o[1]?' on':''}" data-i="${i}">${o[0]}</button>`).join('')}</div>
    ${q.custom?`<div class="custom"><label for="cv">ぴったりの金額で計算：</label><input id="cv" type="number" inputmode="numeric" min="1" max="200" placeholder="例 22"><span>万円</span><button type="button" id="cvb">この金額で次へ</button></div>`:''}
    ${idx>0?'<button type="button" class="back" id="back">← ひとつ前に戻る</button>':''}
  </section>`;
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{ans[q.id]=q.opts[+b.dataset.i][1];next();}));
  const bk=document.getElementById('back'); if(bk)bk.addEventListener('click',()=>{idx--;showQ();});
  const cvb=document.getElementById('cvb');
  if(cvb)cvb.addEventListener('click',()=>{const v=parseFloat(document.getElementById('cv').value);
    if(!(v>0&&v<=200)){document.getElementById('cv').focus();return;} ans[q.id]=v;next();});
  app.querySelector('.opt').focus({preventScroll:true}); window.scrollTo(0,0);
}
function next(){idx++;showQ();}
